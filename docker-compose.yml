services:
  lixphotography-website:
    build:
      context: .
      dockerfile: apps/lixphotography-website/Dockerfile
    ports: ["4210:4210"]
    env_file: [.env.production]
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 4210
  cetric-portfolio:
    build:
      context: .
      dockerfile: apps/cetric-portfolio/Dockerfile
    ports: ["4211:4211"]
    env_file: [.env.production]
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 4211
